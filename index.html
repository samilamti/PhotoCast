<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>PhotoCast Receiver</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
                 font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }

    /* Two stacked layers so consecutive photos can crossfade / slide. */
    .layer {
      position: absolute; inset: 0;
      background-repeat: no-repeat;
      background-size: contain;            /* overridden per-photo by the "fit" mode */
      background-position: center;         /* overridden per-photo by the "focus"    */
      opacity: 0;
      transition: opacity 900ms ease, transform 900ms ease;
      transform: translateX(0);
      will-change: opacity, transform;
    }
    .layer.show   { opacity: 1; transform: translateX(0); }
    /* Slide-in: incoming starts off the right edge, outgoing exits left. */
    .layer.slideInStart  { transform: translateX(100%);  opacity: 1; transition: none; }
    .layer.slideOut      { transform: translateX(-100%); opacity: 1; }
    /* Hard cut: no animation. */
    .layer.cut { transition: none; }

    /* Blurred fill backdrop: a zoomed, blurred copy behind a "contain" photo so the
       letterbox bars are filled instead of black. Toggled by the "blur" fit mode. */
    #backdrop {
      position: absolute; inset: -8%;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      filter: blur(34px) brightness(0.55); opacity: 0; transition: opacity 900ms ease;
    }
    #backdrop.show { opacity: 1; }

    .layer.kenburns { animation: kenburns 18s ease-out forwards; }
    @keyframes kenburns {
      from { transform: scale(1.0)  translate(0, 0); }
      to   { transform: scale(1.14) translate(var(--kb-x, -2%), var(--kb-y, -2%)); }
    }

    /* Bottom scrim so the caption stays readable on bright photos. */
    #scrim {
      position: absolute; left: 0; right: 0; bottom: 0; height: 160px; pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,.55), transparent);
      opacity: 0; transition: opacity 600ms ease;
    }
    #scrim.show { opacity: 1; }

    /* Where + when the photo was taken (replaces the old one-line title caption).
       48px insets keep everything clear of TV overscan.

       Legibility across a whole slideshow is the hard part: a single soft shadow disappears
       against a bright, busy photo. Each line instead gets a HARD black copy offset down-right
       (the "3d" extrusion — it reads as depth and, more usefully, guarantees a black edge on
       every glyph regardless of what's behind it) plus a soft drop shadow underneath it. That
       carries enough contrast that the type can be a size smaller than it used to be. */
    #caption {
      position: absolute; left: 48px; bottom: 44px; max-width: 55vw;
      color: #fff;
      opacity: 0; transition: opacity 600ms ease;
    }
    #caption.show { opacity: 1; }
    #captionPlace {
      font-size: 30px; font-weight: 700; line-height: 1.2;
      text-shadow: 2px 2px 0 #000, 3px 3px 0 rgba(0,0,0,.75), 0 4px 14px rgba(0,0,0,.9);
    }
    #captionWhen  {
      font-size: 21px; font-weight: 500; margin-top: 6px; color: rgba(255,255,255,.92);
      text-shadow: 1px 2px 0 #000, 2px 3px 0 rgba(0,0,0,.6), 0 3px 10px rgba(0,0,0,.85);
    }

    /* Mini-map, right-hand side. Two inner layers crossfade on a recenter. */
    #map {
      position: absolute; right: 48px; bottom: 44px;
      width: 22vw; height: 15vw; min-width: 280px; min-height: 190px;
      border-radius: 12px; overflow: hidden;
      border: 2px solid rgba(255,255,255,.30);
      box-shadow: 0 8px 30px rgba(0,0,0,.55);
      opacity: 0; transition: opacity 700ms ease;
      /* Matches the basemap's own land colour, so the panel doesn't flash a different shade
         underneath while a recenter's tiles are still arriving. */
      background: #f2eee7;
    }
    #map.show { opacity: 1; }
    .mapLayer { position: absolute; inset: 0; opacity: 0; transition: opacity 700ms ease; }
    .mapLayer.show { opacity: 1; }
    .mapLayer img { position: absolute; width: 256px; height: 256px; }
    /* Attribution sits TOP-right now that the bottom of the panel belongs to the place label. */
    #mapAttribution {
      position: absolute; right: 4px; top: 3px; font-size: 9px;
      color: rgba(0,0,0,.6); background: rgba(255,255,255,.55);
      padding: 1px 4px; border-radius: 3px;
    }

    /* Where this is, in English, across the bottom of the panel. The basemap itself carries no
       text at all (see map.tileURL), so this label is the ONLY writing on the map — which is what
       makes "always in English" true regardless of which country the photo is from. Its own
       gradient doubles as the scrim that keeps it readable over streets and water alike. */
    #mapLabel {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 20px 8px 7px; text-align: center; pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,.78), transparent);
      opacity: 0; transition: opacity 500ms ease;
    }
    #mapLabel.show { opacity: 1; }
    #mapCity {
      font-size: 17px; font-weight: 700; line-height: 1.15; color: #fff;
      text-shadow: 1px 1px 0 #000, 0 2px 8px rgba(0,0,0,.9);
    }
    #mapCountry {
      font-size: 13px; font-weight: 500; line-height: 1.25; color: rgba(255,255,255,.86);
      text-shadow: 1px 1px 0 #000, 0 2px 6px rgba(0,0,0,.9);
    }

    /* Scatter: up to five photo "prints" tossed on the table, then featured in turn. */
    #scatter { position: absolute; inset: 0; }
    .card {
      position: absolute; left: 50%; top: 50%;
      background: #fff; border-radius: 4px;
      /* The white print border. Set from the CARD_PAD constant in JS so the centering
         margins (which subtract it) can't drift out of sync with this value. */
      padding: var(--card-pad, 7px);
      box-shadow: 0 12px 40px rgba(0,0,0,.6);
      transition: transform 1000ms cubic-bezier(.22,.9,.34,1), opacity 400ms ease,
                  filter 800ms ease;
      will-change: transform;
    }
    .card .ph { width: 100%; height: 100%; background-size: cover; background-position: center;
                background-repeat: no-repeat; border-radius: 2px; }
    .card.dim { filter: brightness(.55); }

    /* Stacking, bottom to top: backdrop -> photo layers (auto) -> resting prints (20-24) ->
       scrim -> mini-map -> the FEATURED print (45) -> caption -> notice.
       Only the featured photo covers the map; the ones still lying on the table pass behind
       it, so the map is never buried under scenery it isn't describing.
       NOTE #scatter itself must NOT carry a z-index. It's positioned, so a z-index would make
       it a stacking context and trap every card at one level — which is what previously kept
       even the featured card (inline z-index 60) underneath the map. With `auto` the cards'
       own z-indexes are compared against #map directly, which is the whole trick here.
       CARD_Z / CARD_Z_FEATURED in the script are the values that straddle the map. */
    #scrim   { z-index: 30; }
    #map     { z-index: 40; }
    #caption { z-index: 50; }

    /* The CAF media element (used for video). It FADES rather than snapping on: cutting from a
       photo straight to a film's first frame is jarring, and cutting back the instant the film
       ends is worse. `visibility` is what actually keeps it from swallowing clicks and paint work
       while photos are up, so it flips at the far end of the fade on the way out (0s delay 600ms)
       and immediately on the way in — the standard way to make an invisible element fade at all. */
    cast-media-player {
      position: absolute; inset: 0;
      opacity: 0; visibility: hidden;
      transition: opacity 600ms ease, visibility 0s linear 600ms;
    }
    cast-media-player.show {
      opacity: 1; visibility: visible;
      transition: opacity 600ms ease, visibility 0s;
    }

    #idle {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #5a6573; font-size: 26px; letter-spacing: .04em;
    }

    /* A single short line, top-centre. This replaced a diagnostic card that printed the media
       element's error codes and the failing URL over the slideshow — which put a wall of
       monospace text in front of the one audience that can do nothing about it. Every detail now
       travels back to the PHONE over the custom namespace (see `report`), and the TV keeps only
       what the room actually needs to know: that the music quietly became the ambient pad.
       Nothing else is ever shown here. */
    #notice {
      position: absolute; left: 50%; top: 40px; transform: translateX(-50%);
      z-index: 60; max-width: 60vw;
      background: rgba(12,16,22,.82); border: 1px solid rgba(255,255,255,.20);
      border-radius: 999px; padding: 9px 20px; color: rgba(255,255,255,.92);
      font-size: 16px; line-height: 1.3; white-space: nowrap;
      opacity: 0; transition: opacity 500ms ease; pointer-events: none;
    }
    #notice.show { opacity: 1; }
  </style>
</head>
<body class="photos">
  <div id="backdrop"></div>
  <div id="layerA" class="layer"></div>
  <div id="layerB" class="layer"></div>
  <div id="scatter"></div>
  <div id="scrim"></div>
  <div id="caption">
    <div id="captionPlace"></div>
    <div id="captionWhen"></div>
  </div>
  <div id="map">
    <div class="mapLayer" id="mapLayerA"></div>
    <div class="mapLayer" id="mapLayerB"></div>
    <div id="mapAttribution">© OpenStreetMap © CARTO</div>
    <div id="mapLabel">
      <div id="mapCity"></div>
      <div id="mapCountry"></div>
    </div>
  </div>
  <div id="idle">PhotoCast — ready</div>
  <div id="notice"></div>

  <!-- Music streamed from the phone (mode "phone"): the sender exports the chosen songs and
       serves them off its own LAN HTTP server, same as the photos. Separate from
       <cast-media-player>, which owns video playback and its own audio. -->
  <audio id="tune" preload="auto"></audio>

  <!-- The CAF media element handles video. -->
  <cast-media-player></cast-media-player>

  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    const layers = [document.getElementById('layerA'), document.getElementById('layerB')];
    const backdrop = document.getElementById('backdrop');
    const scrim = document.getElementById('scrim');
    const caption = document.getElementById('caption');
    const captionPlace = document.getElementById('captionPlace');
    const captionWhen = document.getElementById('captionWhen');
    const idle = document.getElementById('idle');
    const scatterRoot = document.getElementById('scatter');
    let active = 0;
    let loadSeq = 0;   // guards the deferred bitmap-free against a fast re-LOAD reusing the layer

    // ------------------------------------------------------------------ caption
    // New senders attach customData.photo = {place, dateText, timeText, lat, lon};
    // old senders only have metadata.title — keep showing that so they don't regress.
    function setCaption(photo, legacyTitle) {
      let place = '', when = '';
      // An EMPTY object counts as "no metadata" and falls through to the legacy title: photos are
      // now registered as `{}` so a late place name has something to be patched into, and that
      // placeholder must not silently replace the caption a metadata-less photo would have had.
      const hasFields = photo && typeof photo === 'object'
        && (photo.place || photo.dateText || photo.timeText);
      if (hasFields) {
        place = photo.place || '';
        when = [photo.dateText, photo.timeText].filter(Boolean).join('  ');
        if (!place && when) { place = when; when = ''; }   // time-only: promote to the big line
      } else {
        place = legacyTitle || '';
      }
      captionPlace.textContent = place;
      captionWhen.textContent = when;
      captionWhen.style.display = when ? '' : 'none';
      const show = !!place;
      caption.classList.toggle('show', show);
      scrim.classList.toggle('show', show);
    }

    // ------------------------------------------------------------------ mini-map
    // Hand-rolled tile compositor (no library): a small box of absolutely positioned 256px tiles
    // centered on the current anchor. Two layers crossfade on a recenter, old tiles are freed.
    //
    // There is deliberately NO marker. The point is the photo's general area, not a precise
    // pin — so the map just shows the neighbourhood and the panel reads as context rather
    // than as a GPS readout. With no pin, though, the panel is only truthful while the anchor is
    // near the photo, which is what drives the recentering rule in `update`.
    const map = {
      el: document.getElementById('map'),
      layers: [document.getElementById('mapLayerA'), document.getElementById('mapLayerB')],
      label: document.getElementById('mapLabel'),
      city: document.getElementById('mapCity'),
      country: document.getElementById('mapCountry'),
      active: 0,
      anchor: null,           // {lat, lon} the tiles are centered on
      // Each level doubles the scale. At 13 the panel covers a district — streets and coastline
      // are legible, which is what makes it recognisable as somewhere rather than as a
      // generic patch of map. (It was 11, a whole region, back when the panel had to keep one
      // anchor for a long time; at that scale nothing was identifiable.)
      ZOOM: 13,
      // Recenter once the photo drifts past this fraction of the box's half-width/height — about
      // 500 m at the size and zoom above. It was 0.35 at zoom 11, which worked out to roughly
      // NINE KILOMETRES: a whole city's worth of photos shared one anchor, so the map sat on the
      // first location of the day while the slideshow moved across town. Anything under this
      // threshold really is inside the tiles already on screen, so the cost of being prompt is
      // just a tile fetch on genuinely new ground.
      DRIFT_FRACTION: 0.18,

      // Label-free basemap. Standard OSM raster tiles bake each region's LOCAL language into the
      // image — a photo from Athens came back in Greek, one from Tokyo in Japanese — and there is
      // no raster tile server that reliably renders the whole world in English. So the basemap
      // carries no text at all and #mapLabel draws the place name itself, from the English
      // reverse-geocode the phone sends. Attribution for both providers is in #mapAttribution.
      // "voyager_nolabels" over the darker/lighter alternatives because it keeps the COLOUR —
      // blue water, green parks, yellow arterials — which is what makes a district identifiable
      // at a glance; the flat monochrome variants render a coastline and a car park alike.
      TILE_HOSTS: ['a', 'b', 'c', 'd'],
      tileURL(z, x, y) {
        const host = this.TILE_HOSTS[Math.abs(x + y) % this.TILE_HOSTS.length];
        return 'https://' + host + '.basemaps.cartocdn.com/rastertiles/voyager_nolabels/'
             + z + '/' + x + '/' + y + '.png';
      },

      tileXY(lat, lon, z) {
        const n = Math.pow(2, z);
        const x = (lon + 180) / 360 * n;
        const latR = lat * Math.PI / 180;
        const y = (1 - Math.log(Math.tan(latR) + 1 / Math.cos(latR)) / Math.PI) / 2 * n;
        return { x, y };
      },

      // Fill one layer with the tiles around `center` and crossfade it in.
      render(center) {
        const box = this.el.getBoundingClientRect();
        const W = box.width, H = box.height;
        const c = this.tileXY(center.lat, center.lon, this.ZOOM);
        const cx = c.x * 256, cy = c.y * 256;
        const left = cx - W / 2, top = cy - H / 2;
        const n = Math.pow(2, this.ZOOM);

        const incoming = this.layers[(this.active + 1) % 2];
        const outgoing = this.layers[this.active];
        incoming.innerHTML = '';
        for (let tx = Math.floor(left / 256); tx * 256 < left + W; tx++) {
          for (let ty = Math.floor(top / 256); ty * 256 < top + H; ty++) {
            if (ty < 0 || ty >= n) continue;
            const img = document.createElement('img');
            const wx = ((tx % n) + n) % n;               // wrap antimeridian
            img.onerror = () => img.remove();            // failed tile -> quiet dark gap, no broken icon
            img.src = this.tileURL(this.ZOOM, wx, ty);
            img.style.left = (tx * 256 - left) + 'px';
            img.style.top = (ty * 256 - top) + 'px';
            incoming.appendChild(img);
          }
        }
        incoming.classList.add('show');
        outgoing.classList.remove('show');
        // Free the outgoing tiles once the crossfade is over.
        setTimeout(() => { if (!outgoing.classList.contains('show')) outgoing.innerHTML = ''; }, 900);
        this.active = (this.active + 1) % 2;
        this.anchor = center;
      },

      // How far `loc` sits from the current anchor, as a fraction of the box's half-size.
      // Measured in PIXELS AT THE CURRENT ZOOM rather than in km, so the threshold keeps
      // meaning the same thing on any screen size and at any zoom level.
      driftFromAnchor(loc) {
        const box = this.el.getBoundingClientRect();
        const a = this.tileXY(this.anchor.lat, this.anchor.lon, this.ZOOM);
        const p = this.tileXY(loc.lat, loc.lon, this.ZOOM);
        const dx = Math.abs(p.x - a.x) * 256, dy = Math.abs(p.y - a.y) * 256;
        return Math.max(dx / (box.width / 2), dy / (box.height / 2));
      },

      // City on top, country under it — always in English, whatever the tiles or the phone's own
      // language. Set on EVERY photo, including the ones that don't move the anchor, so the name
      // can never lag the picture.
      setLabel(photo) {
        const city = (photo && photo.city) || '';
        const country = (photo && photo.country) || '';
        this.city.textContent = city;
        this.country.textContent = country;
        this.country.style.display = country ? '' : 'none';
        this.label.classList.toggle('show', !!(city || country));
      },

      // The per-photo entry point. A photo with no coordinates HIDES the panel rather than
      // leaving the previous photo's map and city up: an unrelated place named under someone
      // else's picture is worse than no map, and stripped-EXIF photos (screenshots, forwarded
      // images) are common enough that the stale panel was on screen for minutes at a time.
      update(photo) {
        if (!photo || typeof photo.lat !== 'number' || typeof photo.lon !== 'number') {
          this.hide();
          return;
        }
        const loc = { lat: photo.lat, lon: photo.lon };
        if (!this.anchor || this.driftFromAnchor(loc) > this.DRIFT_FRACTION) {
          this.render(loc);
        }
        this.setLabel(photo);
        this.el.classList.add('show');
      },

      hide() {
        this.el.classList.remove('show');
        this.label.classList.remove('show');
      }
    };

    // ------------------------------------------------------------------ ambient music
    // Fully synthesized on the TV via Web Audio — zero assets, zero licensing. A slow pad
    // (two detuned oscillators per note through a gently wandering lowpass and a feedback
    // delay) plus occasional sparkles from the style's own scale. Cast receivers may start
    // audio without a user gesture, so this can begin on the first LOAD.
    //
    // Five STYLES, chosen from the phone. They differ in harmony, register, timbre and pace,
    // not just in pitch — switching styles should sound like a different record, not a
    // transposition. On top of that each style self-varies (see scheduleChord) so an hour-long
    // slideshow doesn't settle into an audibly repeating four-chord loop.
    const AMBIENT_STYLES = {
      // Major 7ths, mid register — the original pad.
      calm: {
        chords: [
          [130.81, 164.81, 196.00, 246.94],   // C3 E3 G3 B3   (Cmaj7)
          [110.00, 130.81, 164.81, 196.00],   // A2 C3 E3 G3   (Am7)
          [ 87.31, 110.00, 130.81, 164.81],   // F2 A2 C3 E3   (Fmaj7)
          [ 98.00, 123.47, 146.83, 220.00],   // G2 B2 D3 A3   (Gadd9)
        ],
        sparkles: [523.25, 587.33, 659.26, 783.99, 880.00],   // C5 D5 E5 G5 A5
        seconds: 14, cutoff: 700, wander: 220, delay: 0.45, feedback: 0.34, wet: 0.25,
        level: 0.055, gain: 0.12, voices: [['sine', 0, 1], ['triangle', 6, 0.35]],
      },
      // Lower and rounder sevenths, slower — a fireside record.
      warm: {
        chords: [
          [ 73.42,  98.00, 116.54, 146.83],   // D2 G2 A#2 D3  (Dm7)
          [ 87.31, 116.54, 130.81, 174.61],   // F2 A#2 C3 F3  (Bbmaj7/F)
          [ 65.41,  98.00, 123.47, 164.81],   // C2 G2 B2 E3   (Cmaj9)
          [ 82.41, 110.00, 123.47, 164.81],   // E2 A2 B2 E3   (Am/E)
        ],
        sparkles: [349.23, 392.00, 466.16, 523.25, 587.33],   // F4 G4 A#4 C5 D5
        seconds: 17, cutoff: 520, wander: 150, delay: 0.62, feedback: 0.38, wet: 0.30,
        level: 0.060, gain: 0.12, voices: [['sine', 0, 1], ['sine', 9, 0.5]],
      },
      // Minor, dark and sparse — evening photos.
      night: {
        chords: [
          [ 55.00,  82.41, 110.00, 130.81],   // A1 E2 A2 C3   (Am)
          [ 61.74,  92.50, 123.47, 146.83],   // B1 F#2 B2 D3  (Bm)
          [ 65.41,  98.00, 130.81, 155.56],   // C2 G2 C3 D#3  (Cm)
          [ 49.00,  73.42,  98.00, 123.47],   // G1 D2 G2 B2   (G)
        ],
        sparkles: [329.63, 392.00, 440.00, 523.25],           // E4 G4 A4 C5
        seconds: 20, cutoff: 420, wander: 120, delay: 0.75, feedback: 0.42, wet: 0.34,
        level: 0.065, gain: 0.11, voices: [['sine', 0, 1], ['triangle', 4, 0.22]],
      },
      // Diatonic sevenths an octave up, quicker turnover — daylight and holidays.
      bright: {
        chords: [
          [174.61, 220.00, 261.63, 329.63],   // F3 A3 C4 E4   (Fmaj7)
          [196.00, 246.94, 293.66, 349.23],   // G3 B3 D4 F4   (G7)
          [164.81, 196.00, 246.94, 293.66],   // E3 G3 B3 D4   (Em7)
          [146.83, 220.00, 261.63, 349.23],   // D3 A3 C4 F4   (Dm7)
        ],
        sparkles: [659.26, 783.99, 880.00, 987.77, 1174.66],  // E5 G5 A5 B5 D6
        seconds: 11, cutoff: 1100, wander: 320, delay: 0.33, feedback: 0.28, wet: 0.22,
        level: 0.042, gain: 0.11, voices: [['triangle', 0, 1], ['sine', 7, 0.55]],
      },
      // Barely-there fifths that hang for half a minute — closest to silence.
      drift: {
        chords: [
          [ 65.41,  98.00, 196.00],           // C2 G2 G3
          [ 73.42, 110.00, 220.00],           // D2 A2 A3
          [ 87.31, 130.81, 261.63],           // F2 C3 C4
          [ 55.00,  82.41, 164.81],           // A1 E2 E3
        ],
        sparkles: [392.00, 523.25, 587.33],                   // G4 C5 D5
        seconds: 26, cutoff: 380, wander: 90, delay: 0.9, feedback: 0.45, wet: 0.36,
        level: 0.070, gain: 0.10, voices: [['sine', 0, 1], ['sine', 5, 0.4]],
      },
    };

    const ambient = {
      ctx: null, master: null, filter: null, lfoGain: null, delay: null, fb: null, wet: null,
      timer: null, on: false, chordIdx: 0,
      styleName: 'calm', style: AMBIENT_STYLES.calm,

      ensureContext() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const s = this.style;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0;

        this.filter = this.ctx.createBiquadFilter();
        this.filter.type = 'lowpass';
        this.filter.frequency.value = s.cutoff;
        this.filter.Q.value = 0.4;
        const lfo = this.ctx.createOscillator();
        lfo.frequency.value = 0.05;
        this.lfoGain = this.ctx.createGain();
        this.lfoGain.gain.value = s.wander;
        lfo.connect(this.lfoGain).connect(this.filter.frequency);
        lfo.start();

        this.delay = this.ctx.createDelay(1.0);
        this.delay.delayTime.value = s.delay;
        this.fb = this.ctx.createGain(); this.fb.gain.value = s.feedback;
        this.wet = this.ctx.createGain(); this.wet.gain.value = s.wet;
        this.delay.connect(this.fb).connect(this.delay);
        this.filter.connect(this.delay).connect(this.wet).connect(this.master);
        this.filter.connect(this.master);
        this.master.connect(this.ctx.destination);
      },

      // Retune the (single, long-lived) signal chain to another style. Ramps rather than
      // jumps so a style change mid-slideshow is a slow morph, not a click.
      applyStyleToGraph() {
        if (!this.ctx) return;
        const s = this.style, t = this.ctx.currentTime, T = 2.5;
        this.filter.frequency.linearRampToValueAtTime(s.cutoff, t + T);
        this.lfoGain.gain.linearRampToValueAtTime(s.wander, t + T);
        this.delay.delayTime.linearRampToValueAtTime(s.delay, t + T);
        this.fb.gain.linearRampToValueAtTime(s.feedback, t + T);
        this.wet.gain.linearRampToValueAtTime(s.wet, t + T);
        if (this.on) this.master.gain.linearRampToValueAtTime(s.gain, t + T);
      },

      setStyle(name) {
        const next = AMBIENT_STYLES[name] ? name : 'calm';
        if (next === this.styleName) return;
        this.styleName = next;
        this.style = AMBIENT_STYLES[next];
        this.chordIdx = 0;
        this.applyStyleToGraph();
      },

      note(freq, t0, dur, level) {
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(level, t0 + Math.min(4, dur * 0.35));
        g.gain.setValueAtTime(level, t0 + dur - Math.min(5, dur * 0.4));
        g.gain.linearRampToValueAtTime(0, t0 + dur);
        for (const [type, detune, mix] of this.style.voices) {
          const o = this.ctx.createOscillator();
          o.type = type; o.frequency.value = freq; o.detune.value = detune;
          const og = this.ctx.createGain(); og.gain.value = mix;
          o.connect(og).connect(g);
          o.start(t0); o.stop(t0 + dur + 0.1);
        }
        g.connect(this.filter);
      },

      scheduleChord() {
        if (!this.on || !this.ctx) return;
        const s = this.style;
        // Self-variation, so the loop never lands the same way twice: the chord length
        // breathes ±15%, one voice is occasionally lifted an octave (a different inversion),
        // the progression sometimes skips a chord, and the sparkle count varies 1-3.
        const seconds = s.seconds * (0.85 + Math.random() * 0.3);
        const dur = seconds + 4;                          // overlap into the next chord
        const chord = s.chords[this.chordIdx % s.chords.length];
        this.chordIdx += Math.random() < 0.2 ? 2 : 1;
        const lift = Math.random() < 0.35 ? Math.floor(Math.random() * chord.length) : -1;
        chord.forEach((f, i) => {
          this.note(i === lift ? f * 2 : f, this.ctx.currentTime + 0.05 + i * 0.35, dur, s.level);
        });
        const sparkleCount = 1 + Math.floor(Math.random() * 3);
        for (let k = 0; k < sparkleCount; k++) {
          const f = s.sparkles[Math.floor(Math.random() * s.sparkles.length)];
          this.note(f, this.ctx.currentTime + 2 + Math.random() * Math.max(1, seconds - 4),
                    3.2, s.level * 0.3);
        }
        this.timer = setTimeout(() => this.scheduleChord(), seconds * 1000);
      },

      start() {
        this.ensureContext();
        if (!this.ctx) return;
        // Already running but the platform suspended the context (audio focus churn, e.g.
        // after a video) — nudge it back to life rather than early-returning into silence.
        if (this.ctx.state === 'suspended' && this.ctx.resume) this.ctx.resume();
        if (this.on) return;
        this.on = true;
        this.ctx.resume && this.ctx.resume();
        this.master.gain.cancelScheduledValues(this.ctx.currentTime);
        this.master.gain.setValueAtTime(this.master.gain.value, this.ctx.currentTime);
        this.master.gain.linearRampToValueAtTime(this.style.gain, this.ctx.currentTime + 3);
        this.scheduleChord();
      },

      stop() {
        if (!this.on) return;
        this.on = false;
        clearTimeout(this.timer);
        if (this.ctx) {
          this.master.gain.cancelScheduledValues(this.ctx.currentTime);
          this.master.gain.setValueAtTime(this.master.gain.value, this.ctx.currentTime);
          this.master.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1.2);
        }
      }
    };

    // ------------------------------------------------------------------ problems -> the phone
    // A failure that only happens on the TV can't be read from a console, so it has to be
    // reported somewhere — but NOT here. The TV is what the room is looking at, so an error drawn
    // over the slideshow interrupts the one thing the app exists to do, in front of the one
    // audience that can't act on it. Everything therefore goes back to the phone over the custom
    // namespace, where there's a UI for it and the person holding the device can read it.
    //
    // The namespace must match ReceiverChannel.namespace in the app.
    const NAMESPACE = 'urn:x-cast:com.samixavierlamti.photocast';
    let castContext = null;

    // Rate-limited per source: a bad album can fail on every one of two hundred photos, and two
    // hundred identical messages is neither more informative nor kind to the phone's UI.
    const REPORT_COOLDOWN_MS = 20000;
    const reportedAt = new Map();

    /// `cooldownMs` overrides the per-source rate limit, for a source whose reports are each about
    /// a different thing (video start latency: one measurement per film, and a suppressed one
    /// would read as "that film was fine").
    function report(source, message, detail, cooldownMs) {
      const now = Date.now();
      const cooldown = cooldownMs === undefined ? REPORT_COOLDOWN_MS : cooldownMs;
      if (now - (reportedAt.get(source) || 0) < cooldown) return;
      reportedAt.set(source, now);
      if (!castContext) return;                 // browser testing, or no session yet
      try {
        castContext.sendCustomMessage(NAMESPACE, undefined,
          { type: 'problem', source: source, message: message, detail: detail || '' });
      } catch (e) { /* the sender may have gone; there is nothing useful to do about it here */ }
    }

    // The one thing the TV still says out loud. Deliberately a single short line — the room needs
    // to know the music quietly changed, not why.
    const notice = {
      el: document.getElementById('notice'),
      timer: null,
      show(text) {
        this.el.textContent = text;
        this.el.classList.add('show');
        clearTimeout(this.timer);
        this.timer = setTimeout(() => this.hide(), 6000);
      },
      hide() { clearTimeout(this.timer); this.el.classList.remove('show'); }
    };

    // ------------------------------------------------------------------ phone music stream
    // mode "phone": the sender exported the user's chosen songs and serves them off its own
    // LAN HTTP server; we just play the list here and loop it. The playlist arrives on EVERY
    // image LOAD, so an unchanged list must NOT restart the song — that's what `sig` guards.
    //
    // Getting a picked song to actually play took three defences, because a Cast receiver is a
    // hostile environment for an <audio> element and the first build hit at least one of them
    // (songs silently fell back to the pad on the TV):
    //   1. muted autoplay then unmute — no user gesture exists here, so audible autoplay is
    //      refused (see startPlayback);
    //   2. a blob: retry — the page is a PUBLIC https origin loading from a PRIVATE address,
    //      which Chrome refuses for media ("Permission was denied for this request to access
    //      the `local` address space"; images are exempt, which is why photos were fine). The
    //      phone now sends CORS + Private-Network headers, and fetch-to-blob is the backstop;
    //   3. audio/mp4 rather than the UTI table's audio/x-m4a.
    // If all three still fail, `onExhausted` falls back to the synthesized pad rather than
    // leaving the slideshow silent, the dead playlist isn't retried until it changes, the room
    // gets one short line (`notice`), and the reason goes to the phone (`report`).
    const stream = {
      el: document.getElementById('tune'),
      tracks: [], idx: 0, sig: '', deadSig: '', on: false, errors: 0, fadeTimer: null,
      blobUrl: null, triedBlob: false, notes: [],
      TARGET_VOLUME: 0.7,
      onExhausted: null,

      init() {
        this.el.addEventListener('ended', () => this.advance(1));
        this.el.addEventListener('error', () => {
          const e = this.el.error;
          this.note('media error code=' + (e && e.code) + ' ' + ((e && e.message) || ''));
          this.recover();
        });
        // Anything that actually plays proves the list is fine, so the error budget below
        // counts CONSECUTIVE failures — otherwise a stray hiccup an hour in would eventually
        // add up to "playlist dead" while the music was happily playing.
        // It's also where the muted-autoplay start (see load) is undone.
        this.el.addEventListener('playing', () => {
          this.errors = 0;
          this.triedBlob = false;
          if (this.el.muted) { this.el.muted = false; this.fadeTo(this.TARGET_VOLUME, 1200); }
          this.note('playing ' + (this.tracks[this.idx] && this.tracks[this.idx].title || ''));
          notice.hide();
        });
      },

      note(text) {
        this.notes.push(text);
        if (this.notes.length > 8) this.notes.shift();
      },

      signature(tracks) { return tracks.map(t => t && t.url).join('|'); },

      play(tracks, shuffle) {
        const sig = this.signature(tracks);
        if (sig && sig === this.deadSig) return false;     // known-unplayable list; caller falls back
        if (sig === this.sig && this.on) { this.resume(); return true; }
        this.sig = sig;
        this.tracks = tracks.slice();
        if (shuffle) this.tracks.sort(() => Math.random() - 0.5);
        this.idx = 0;
        this.errors = 0;
        this.notes = [];
        this.on = true;
        this.load();
        return true;
      },

      load() {
        const track = this.tracks[this.idx];
        if (!track || !track.url) { this.advance(1); return; }
        this.triedBlob = false;
        this.releaseBlob();
        this.startPlayback(track.url, 'direct');
      },

      // Start MUTED. Chrome's autoplay policy blocks audible playback that no user gesture
      // asked for — and a Cast receiver has no gestures at all — but muted playback is always
      // allowed, and unmuting once it is already running is not re-gated. The 'playing'
      // listener above does the unmute + fade. (The synthesized pad is unaffected by this:
      // Web Audio isn't governed by the same policy, which is exactly why ambient always
      // worked while picked songs never did.)
      startPlayback(src, how) {
        this.el.muted = true;
        this.el.volume = 0;
        this.el.src = src;
        const started = this.el.play();
        if (started && started.catch) {
          started.catch(err => {
            this.note('play() rejected (' + how + '): ' + err.name + ' — ' + err.message);
            this.recover();
          });
        }
      },

      // Second chance for a track the media element refused to load: fetch the bytes and hand
      // them over as a blob: URL. A blob is same-origin, so it sidesteps whatever refused the
      // cross-origin/private-address load — provided fetch() itself is allowed, which is what
      // the CORS + Private-Network headers on the phone's server are for. Cheap in memory:
      // it holds the COMPRESSED file (a few MB), not decoded audio.
      tryBlob() {
        const track = this.tracks[this.idx];
        if (!track || this.triedBlob) return false;
        this.triedBlob = true;
        fetch(track.url, { mode: 'cors', cache: 'no-store' })
          .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
          .then(b => {
            if (!this.on) return;
            this.releaseBlob();
            // Force a type Chrome definitely accepts. Anything non-audio, and specifically the
            // UTI table's `audio/x-m4a` (which canPlayType only rates "maybe"), becomes
            // audio/mp4 — the same container, under the type Chrome rates "probably".
            const usable = /^audio\//.test(b.type) && b.type !== 'audio/x-m4a';
            const typed = usable ? b : new Blob([b], { type: 'audio/mp4' });
            this.blobUrl = URL.createObjectURL(typed);
            this.note('retrying via blob: (' + Math.round(typed.size / 1024) + ' KB, ' + typed.type + ')');
            this.startPlayback(this.blobUrl, 'blob');
          })
          .catch(e => {
            this.note('fetch failed: ' + e.name + ' — ' + e.message);
            this.giveUpOnTrack();
          });
        return true;
      },

      releaseBlob() {
        if (this.blobUrl) { URL.revokeObjectURL(this.blobUrl); this.blobUrl = null; }
      },

      // A direct load failed: try the blob route once for this track before writing it off.
      recover() {
        if (!this.on) return;
        if (this.tryBlob()) return;
        this.giveUpOnTrack();
      },

      // A whole lap of the playlist failing back-to-back means it's unplayable (bad URLs, the
      // phone asleep, or the browser refusing the private-address load) — give up and let the
      // caller fall back to the pad. The room gets one short line; the media error codes, the
      // rejected play() calls and the failing URL all go to the phone, which is where they can
      // actually be read and acted on.
      giveUpOnTrack() {
        if (!this.on) return;
        this.errors++;
        if (this.errors >= this.tracks.length) {
          this.deadSig = this.sig;
          this.stop();
          notice.show('Using ambient music');
          report('music', 'Your songs could not be played on the TV — using ambient music.',
                 this.notes.concat([(this.tracks[0] && this.tracks[0].url) || '']).join(' | '));
          if (this.onExhausted) this.onExhausted();
          return;
        }
        this.advance(1);
      },

      advance(step) {
        if (!this.on || !this.tracks.length) return;
        this.idx = (this.idx + step + this.tracks.length) % this.tracks.length;
        this.load();
      },

      resume() {
        if (this.el.paused) {
          const p = this.el.play();
          if (p && p.catch) p.catch(() => {});
        }
        if (!this.el.muted) this.fadeTo(this.TARGET_VOLUME, 600);
      },

      stop() {
        if (!this.on) return;
        this.on = false;
        this.fadeTo(0, 900, () => { this.el.pause(); this.releaseBlob(); });
      },

      // <audio>.volume takes no AudioParam ramps, so step it by hand.
      fadeTo(target, ms, done) {
        clearInterval(this.fadeTimer);
        const from = this.el.volume, steps = Math.max(1, Math.round(ms / 50));
        let i = 0;
        this.fadeTimer = setInterval(() => {
          i++;
          const v = from + (target - from) * (i / steps);
          this.el.volume = Math.max(0, Math.min(1, v));
          if (i >= steps) { clearInterval(this.fadeTimer); if (done) done(); }
        }, 50);
      }
    };
    stream.init();
    // Whatever killed the phone stream, the slideshow shouldn't go quiet.
    stream.onExhausted = () => { ambient.start(); };

    // ------------------------------------------------------------------ music routing
    // The sender attaches `customData.audio` = {mode, style, tracks, shuffle}. Senders older
    // than that only send the boolean `customData.music`, which meant "ambient on/off" — keep
    // honoring it so an old app build doesn't go silent against this receiver.
    const music = {
      normalize(audio, legacyFlag) {
        if (audio && typeof audio === 'object') {
          const tracks = Array.isArray(audio.tracks) ? audio.tracks.filter(t => t && t.url) : [];
          const mode = audio.mode || (tracks.length ? 'phone' : 'ambient');
          return { mode, style: audio.style || 'calm', tracks, shuffle: audio.shuffle === true };
        }
        return { mode: legacyFlag === true ? 'ambient' : 'off', style: 'calm', tracks: [], shuffle: false };
      },

      apply(audio, legacyFlag) {
        const spec = this.normalize(audio, legacyFlag);
        if (spec.mode === 'phone' && spec.tracks.length) {
          ambient.setStyle(spec.style);              // the fallback should still be the right style
          if (stream.play(spec.tracks, spec.shuffle)) { ambient.stop(); return; }
          ambient.start();                           // playlist already known-dead
          return;
        }
        stream.stop();
        if (spec.mode === 'off') { ambient.stop(); return; }
        ambient.setStyle(spec.style);
        ambient.start();
      },

      // Video takes over the audio, and STOP empties the screen — silence everything.
      silence() { stream.stop(); ambient.stop(); }
    };

    // ------------------------------------------------------------------ scatter
    // customData.scatter = { interval: seconds, items: [{url, photo}] }. Five prints fly in
    // and land scattered; each is then featured (centered + enlarged, caption/map follow) for
    // `interval`, then returns to its spot. The sender's advance timer is sized to match, so
    // the next LOAD (a fresh batch or a normal photo) arrives right after the last feature.
    // The white "print" border around each card, in px. Single source of truth: it drives the
    // CSS padding AND the centering margins below, which have to subtract it.
    const CARD_PAD = 7;
    document.documentElement.style.setProperty('--card-pad', CARD_PAD + 'px');

    // Card stacking. These straddle #map (z-index 40) on purpose: a print lying on the table
    // passes BEHIND the map, and only the one currently being featured rises above it.
    // CARD_Z_FEATURED stays under #caption (50) so the where/when line is never covered.
    const CARD_Z = 20;            // resting prints: CARD_Z + index, all below the map
    const CARD_Z_FEATURED = 45;   // the one being shown: above the map, below the caption

    const scatter = {
      timers: [], cards: [],

      // Landing anchors (vw/vh offsets from center) — spread over the screen, jittered.
      ANCHORS: [[-30, -18], [27, -20], [-26, 17], [26, 18], [0, -3]],

      // Sweep the DOM (not just the bookkeeping array) so cards can never leak, no matter
      // which path — batch swap, showImage, showVideo — got here first.
      clear() {
        this.timers.forEach(clearTimeout);
        this.timers = [];
        this.cards = [];
        scatterRoot.querySelectorAll('.card').forEach(c => {
          const ph = c.querySelector('.ph');
          if (ph) ph.style.backgroundImage = 'none';
          c.remove();
        });
      },

      preload(url) {
        return new Promise(resolve => {
          const img = new Image();
          const done = () => resolve({ w: img.naturalWidth || 4, h: img.naturalHeight || 3 });
          img.onload = done;
          img.onerror = () => {
            // A print that can't be fetched still lands (as a blank card) so the batch's
            // choreography stays intact — but the phone is told why one of them is empty.
            report('media', 'The TV could not load a photo.', url);
            resolve({ w: 4, h: 3 });
          };
          setTimeout(() => resolve({ w: img.naturalWidth || 4, h: img.naturalHeight || 3 }), 1500);
          img.src = url;
        });
      },

      async show(spec) {
        // Freeze the outgoing batch's choreography but LEAVE its cards on screen while the
        // new batch preloads — clearing first would black the screen for the preload time.
        this.timers.forEach(clearTimeout);
        this.timers = [];
        const outgoing = this.cards;
        this.cards = [];
        const items = spec.items.slice(0, 5);
        // Normalize each item's photo to a real object and register the batch, so a place name
        // arriving mid-batch reaches even the cards that haven't been featured yet.
        items.forEach(it => { it.photo = it.photo || {}; });
        registerPhotos(items);
        const intervalMs = Math.max(2000, (spec.interval || 6) * 1000);
        const vw = window.innerWidth, vh = window.innerHeight;
        const mySeq = ++loadSeq;                        // a newer LOAD cancels this batch

        const sizes = await Promise.all(items.map(it => this.preload(it.url)));
        if (mySeq !== loadSeq) return;                  // superseded; whoever took over cleared the DOM

        // Swap piles: the old cards fade as the new ones fly in (clear() would still sweep
        // them if anything interrupts before this timer fires).
        outgoing.forEach(c => { c.style.opacity = '0'; });
        this.timers.push(setTimeout(() => outgoing.forEach(c => {
          const ph = c.querySelector('.ph');
          if (ph) ph.style.backgroundImage = 'none';
          c.remove();
        }), 450));

        // Landing spots: anchors shuffled, with a little jitter and tilt.
        const spots = this.ANCHORS.slice(0, items.length)
          .map(a => ({
            x: (a[0] + (Math.random() * 8 - 4)) / 100 * vw,
            y: (a[1] + (Math.random() * 6 - 3)) / 100 * vh,
            r: Math.random() * 26 - 13
          }))
          .sort(() => Math.random() - 0.5);

        items.forEach((it, i) => {
          // Card sized to the photo's own aspect, fitted into ~34vmin.
          const base = Math.min(vw, vh) * 0.34;
          const ar = sizes[i].w / sizes[i].h;
          const w = ar >= 1 ? base : base * ar;
          const h = ar >= 1 ? base / ar : base;

          const card = document.createElement('div');
          card.className = 'card';
          card.style.width = w + 'px';
          card.style.height = h + 'px';
          card.style.marginLeft = (-w / 2 - CARD_PAD) + 'px';   // center (incl. the print border)
          card.style.marginTop = (-h / 2 - CARD_PAD) + 'px';
          card.style.zIndex = CARD_Z + i;
          const ph = document.createElement('div');
          ph.className = 'ph';
          ph.style.backgroundImage = `url("${it.url}")`;
          card.appendChild(ph);

          // Start off-screen in a random direction, no transition, then fly to the spot.
          const angle = Math.random() * 2 * Math.PI;
          const offX = Math.cos(angle) * vw * 1.1, offY = Math.sin(angle) * vh * 1.1;
          card.style.transition = 'none';
          card.style.transform = `translate(${offX}px, ${offY}px) rotate(${spots[i].r * 3}deg)`;
          scatterRoot.appendChild(card);
          this.cards.push(card);

          this.timers.push(setTimeout(() => {
            card.style.transition = '';                 // restore the CSS transitions
            card.style.transform =
              `translate(${spots[i].x}px, ${spots[i].y}px) rotate(${spots[i].r}deg)`;
          }, 60 + i * 170));

          // Feature this card in turn: bring to center, straighten, enlarge; dim the rest.
          // Slightly smaller than a full-bleed photo and nudged upward so the caption and
          // mini-map along the bottom edge stay readable beside it.
          const featureAt = 1800 + i * intervalMs;
          this.timers.push(setTimeout(() => {
            const scale = Math.min(vw * 0.78 / w, vh * 0.72 / h);
            card.style.zIndex = CARD_Z_FEATURED;
            card.classList.remove('dim');
            card.style.transform = `translate(0px, ${-vh * 0.03}px) rotate(0deg) scale(${scale})`;
            this.cards.forEach(c => { if (c !== card) c.classList.add('dim'); });
            activeUrl = it.url;                         // late place names now target THIS print
            setCaption(it.photo, '');
            map.update(it.photo);
          }, featureAt));

          // …and send it back to its spot when its time is up (the last one stays big
          // until the next LOAD replaces the batch).
          if (i < items.length - 1) {
            this.timers.push(setTimeout(() => {
              card.style.zIndex = CARD_Z + i;
              card.style.transform =
                `translate(${spots[i].x}px, ${spots[i].y}px) rotate(${spots[i].r}deg)`;
            }, featureAt + intervalMs - 150));
          }
        });
      }
    };

    // ------------------------------------------------------------------ late place names
    // Reverse-geocoding a photo takes a second or two, so its city and country land AFTER the
    // photo is already on screen. The phone sends them separately (see ReceiverChannel.sendPlace)
    // rather than re-sending the LOAD — a re-LOAD would restart the presentation, and in Scatter
    // the entire fly-in choreography, which is why scattered photos previously never gained a
    // place name at all.
    //
    // The values are patched into the SAME objects the render closures are holding, so a scatter
    // card that hasn't been featured yet picks the name up when its turn comes.
    const loadedPhotos = new Map();     // url -> the photo object currently loaded under it
    let activeUrl = null;               // the one the caption and map are describing right now

    function registerPhotos(entries) {
      loadedPhotos.clear();
      for (const e of entries) if (e && e.url) loadedPhotos.set(e.url, e.photo);
    }

    function applyPlace(msg) {
      if (!msg || !msg.url) return;
      const photo = loadedPhotos.get(msg.url);
      if (!photo) return;                       // for a photo that has since left the screen
      if (msg.place) photo.place = msg.place;
      if (msg.city) photo.city = msg.city;
      if (msg.country) photo.country = msg.country;
      if (msg.url === activeUrl) {
        setCaption(photo, '');
        map.update(photo);
      }
    }

    // ------------------------------------------------------------------ photos & video
    // Free the blurred-fill backdrop's pixels, not just its visibility. It holds a full-screen
    // copy of a photo we've stopped showing, and on a 1-2 GB dongle running for an hour that is
    // exactly the kind of thing that ends the slideshow.
    function freeBackdrop() {
      backdrop.classList.remove('show');
      setTimeout(() => {
        if (!backdrop.classList.contains('show')) backdrop.style.backgroundImage = 'none';
      }, 950);
    }

    // A photo the TV can't fetch renders as nothing at all — no event, no error, just black —
    // because it's painted as a CSS background. This probe is the only way to notice, and it
    // reports to the PHONE; the TV shows nothing. Same URL as the background, so Chrome serves
    // both from one request and one decode.
    function watchImageLoad(url, what) {
      const probe = new Image();
      probe.onload = () => { probe.onload = probe.onerror = null; };
      probe.onerror = () => {
        probe.onload = probe.onerror = null;
        report('media', 'The TV could not load ' + what + '.', url);
      };
      probe.src = url;
    }

    // Map a focus keyword to a CSS background-position and a Ken Burns drift target.
    function focusToPosition(focus) {
      switch (focus) {
        case 'top':    return { pos: 'center top',    kb: ['0%', '-3%'] };
        case 'bottom': return { pos: 'center bottom', kb: ['0%', '3%']  };
        case 'left':   return { pos: 'left center',   kb: ['-3%', '0%'] };
        case 'right':  return { pos: 'right center',  kb: ['3%', '0%']  };
        default:       return { pos: 'center center', kb: ['-2%', '-2%'] };
      }
    }

    // The photo currently on the main layers, so a re-LOAD of the same url+presentation
    // (the sender's geocode caption update) repaints only the caption/map — no re-transition.
    // Presentation is part of the key: a preset/focus change re-sends the SAME url and must
    // still repaint the layer. rotateCurrent publishes a new filename, so it never matches.
    let lastShown = null;

    // p = { fit:'contain'|'cover'|'blur', effect:'none'|'kenburns',
    //       transition:'fade'|'slide'|'cut', focus:'center'|'top'|... }
    function showImage(url, title, p, photo) {
      p = p || {};
      photo = photo || {};                   // patched in place when its place name lands
      registerPhotos([{ url, photo }]);
      activeUrl = url;
      // Field-by-field key: NSDictionary -> JSON key order isn't stable across sends.
      const presKey = [p.fit, p.effect, p.transition, p.focus].join('|');
      if (lastShown && lastShown.url === url && lastShown.presKey === presKey) {
        setCaption(photo, title);
        map.update(photo);
        return;
      }
      lastShown = { url, presKey };

      const fit = p.fit || 'contain';
      const effect = p.effect || 'none';
      const transition = p.transition || 'fade';
      const { pos, kb } = focusToPosition(p.focus);

      idle.style.display = 'none';
      document.body.classList.add('photos');
      hideVideo();                                     // a photo replaced the film
      scatter.clear();

      const prev = layers[active];
      const next = layers[(active + 1) % 2];
      const mySeq = ++loadSeq;
      next.dataset.seq = mySeq;        // tag the incoming layer so a stale cleanup can't blank it

      // Blurred-fill backdrop: only meaningful when the photo is "contain" (letterboxed).
      if (fit === 'blur') {
        backdrop.style.backgroundImage = `url("${url}")`;
        backdrop.classList.add('show');
      } else {
        freeBackdrop();
      }

      watchImageLoad(url, 'a photo');

      // Paint the incoming layer.
      next.className = 'layer';                        // reset state classes
      next.style.backgroundImage = `url("${url}")`;
      next.style.backgroundSize = (fit === 'cover') ? 'cover' : 'contain';
      next.style.backgroundPosition = pos;
      next.style.setProperty('--kb-x', kb[0]);
      next.style.setProperty('--kb-y', kb[1]);

      // Transition the incoming layer in / outgoing layer out.
      if (transition === 'cut') {
        next.classList.add('cut', 'show');
      } else if (transition === 'slide') {
        next.classList.add('slideInStart');
        // next frame: animate to resting position (unless a faster LOAD superseded us —
        // without the seq check this callback would re-animate a layer it no longer owns)
        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (next.dataset.seq !== String(loadSeq)) return;
          next.classList.remove('slideInStart');
          next.classList.add('show');
          prev.classList.add('slideOut');
        }));
      } else { // fade
        next.classList.add('show');
      }
      prev.classList.remove('show');

      // Ken Burns runs on the visible layer (independent of the entrance transition).
      if (effect === 'kenburns') {
        next.classList.remove('kenburns'); void next.offsetWidth; next.classList.add('kenburns');
      }

      // Free the outgoing photo's decoded bitmap once it's off-screen — critical for surviving
      // hundreds of loads on a 1–2 GB dongle without the receiver crashing. Skip if a faster
      // re-LOAD has since repainted this same layer (its seq would no longer match the active one).
      setTimeout(() => {
        if (prev.dataset.seq !== String(loadSeq)) { prev.style.backgroundImage = 'none'; prev.className = 'layer'; }
      }, 1000);

      active = (active + 1) % 2;
      setCaption(photo, title);
      map.update(photo);
    }

    function showScatter(spec) {
      idle.style.display = 'none';
      document.body.classList.add('photos');
      hideVideo();
      lastShown = null;                                // the layers no longer own the screen
      activeUrl = null;                                // set per featured card
      // Clear the single-photo layers — the batch owns the screen now.
      layers.forEach(l => { l.classList.remove('show'); l.style.backgroundImage = 'none'; l.className = 'layer'; });
      backdrop.classList.remove('show'); backdrop.style.backgroundImage = 'none';
      setCaption(null, '');                            // captions follow the featured card
      scatter.show(spec);
    }

    // --- Video, with the breathing room a film needs beside a photo slideshow ---------
    // Cutting from a photo straight into a moving picture is abrupt, and cutting back out the
    // frame the film ends on is worse — the last shot never gets to land. So: fade the player up
    // over the outgoing photo, let it settle for a beat BEFORE the first frame moves, and when the
    // film ends hold that last frame before fading away. The sender waits the same tail out (see
    // CastController.videoTailSeconds) so the next photo doesn't arrive during the hold.
    const player = document.querySelector('cast-media-player');
    const VIDEO_FADE_MS = 600;    // must match the CSS transition on cast-media-player
    const VIDEO_LEAD_MS = 1000;   // faded in, first frame held, THEN it starts moving
    const VIDEO_TAIL_MS = 2000;   // the last frame stays up this long before fading out
    const VIDEO_BELT_MS = 4000;   // last resort if no readiness signal ever arrives at all
    /// A film that takes longer than this from LOAD to first movement waited on something the
    /// lead-in doesn't explain, so the measurement goes to the phone (see reportVideoStart).
    const VIDEO_SLOW_MS = 2000;
    /// One measurement per film, so this is nearly unrestricted — but not entirely, in case some
    /// pathological loop starts a film over and over.
    const VIDEO_TIMING_COOLDOWN_MS = 3000;
    let videoStartTimer = null, videoEndTimer = null;
    /// True once the film has been set rolling (by us, or by the phone pressing play/pause), which
    /// makes the lead-in a strictly one-shot affair. Without it the belt below would re-issue
    /// play() on any later status update — so pausing from the phone mid-film would silently
    /// un-pause itself a few seconds later.
    let videoRolling = false;
    /// True while a real (post-readiness) lead-in is counting down, as distinct from the belt.
    /// Readiness is announced repeatedly, and re-arming the lead on each announcement would push
    /// the start one lead further away every time — the film would never move at all.
    let videoLeadArmed = false;
    /// Start-latency bookkeeping for the current film: when its LOAD arrived, when the player
    /// first said it was ready to play (0 = never did), and which signal actually rolled it.
    let videoLoadAt = 0, videoReadyAt = 0, videoStartTrigger = '';

    function showVideo() {
      clearTimeout(videoStartTimer); clearTimeout(videoEndTimer);
      videoStartTimer = null;
      videoRolling = false;
      videoLeadArmed = false;
      videoLoadAt = Date.now(); videoReadyAt = 0; videoStartTrigger = '';
      document.body.classList.remove('photos');
      lastShown = null;
      activeUrl = null;
      layers.forEach(l => { l.classList.remove('show'); l.style.backgroundImage = 'none'; });
      backdrop.classList.remove('show'); backdrop.style.backgroundImage = 'none';
      scatter.clear();
      ++loadSeq;                                       // cancel any in-flight scatter batch
      setCaption(null, '');
      map.hide();
      idle.style.display = 'none';
      player.classList.add('show');                    // fade up over whatever was there
    }

    /// Take the player back down at once (a photo LOAD, or a STOP, arrived instead of the film
    /// ending naturally — no last frame worth holding in either case).
    function hideVideo() {
      clearTimeout(videoStartTimer); clearTimeout(videoEndTimer);
      videoStartTimer = null;
      videoRolling = false;
      videoLeadArmed = false;
      player.classList.remove('show');
    }

    /// The film ended: leave its closing frame up, then fade out. The next photo's own fade-in
    /// takes over from black.
    function holdThenHideVideo() {
      clearTimeout(videoEndTimer);
      videoEndTimer = setTimeout(() => player.classList.remove('show'), VIDEO_TAIL_MS);
    }

    /// Is a film (rather than a photo) what's on screen? Every video-only handler below is gated
    /// on this, because the sender's image LOADs go through CAF's player as well — and CAF raises
    /// its own ERROR on a jpeg it can't play, which without this gate would report a "video
    /// problem" to the phone for every single photo in the slideshow.
    function showingVideo() { return !document.body.classList.contains('photos'); }

    /// The player has the film loaded and holding its first frame. Recorded once, because CAF
    /// announces it more than once and the first announcement is the one that measures the wait.
    function noteVideoReady() { if (!videoReadyAt) videoReadyAt = Date.now(); }

    /// Roll the film `delay` from now — once per video, never against a film that is already
    /// running or that the phone has taken control of, and never displacing a lead-in that is
    /// already counting down (see videoLeadArmed). `trigger` names the signal that got us here and
    /// travels with the measurement; 'belt' marks the last-resort path, which yields to any real
    /// readiness signal that arrives later but is never pushed back by another belt call.
    function startVideoAfterLead(playerManager, delay, trigger) {
      if (videoRolling) return;
      const isLead = trigger !== 'belt';
      if (isLead && videoLeadArmed) return;
      if (!isLead && videoStartTimer !== null) return;
      clearTimeout(videoStartTimer);
      videoLeadArmed = isLead;
      videoStartTrigger = trigger;
      videoStartTimer = setTimeout(() => {
        videoStartTimer = null;
        if (!showingVideo() || videoRolling) return;
        videoRolling = true;
        playerManager.play();
        reportVideoStart(playerManager);
      }, delay === undefined ? VIDEO_LEAD_MS : delay);
    }

    /// How long the film actually took to start moving, sent to the phone when that is longer than
    /// the lead-in explains. WHERE the time went is the whole diagnosis, so the breakdown travels
    /// with it: a large `ready` is the network or the player buffering ahead, while a `trigger`
    /// other than load-complete means the readiness event the lead-in hangs on never arrived and
    /// something slower had to notice. Silence means the wait was the deliberate lead-in, nothing
    /// more — which is an answer too.
    function reportVideoStart(playerManager) {
      if (!videoLoadAt) return;
      const total = Date.now() - videoLoadAt;
      if (total <= VIDEO_SLOW_MS && videoStartTrigger === 'load-complete') return;
      let clip = 0;
      try { clip = playerManager.getDurationSec() || 0; } catch (e) { /* nothing to do about it */ }
      report('video-timing',
             'A video took ' + (total / 1000).toFixed(1) + ' s to start on the TV.',
             'ready=' + (videoReadyAt ? ((videoReadyAt - videoLoadAt) / 1000).toFixed(1) + 's' : 'never')
               + ' lead=' + (VIDEO_LEAD_MS / 1000).toFixed(1) + 's'
               + ' trigger=' + (videoStartTrigger || '?')
               + ' clip=' + clip.toFixed(0) + 's',
             VIDEO_TIMING_COOLDOWN_MS);
    }

    // Sender STOP (stop button / Clear): silence the pad and return to the idle screen —
    // without this the music would keep playing over an empty receiver indefinitely.
    function handleStopped() {
      music.silence();
      notice.hide();
      hideVideo();
      lastShown = null;
      activeUrl = null;
      loadedPhotos.clear();
      layers.forEach(l => { l.classList.remove('show'); l.style.backgroundImage = 'none'; l.className = 'layer'; });
      backdrop.classList.remove('show'); backdrop.style.backgroundImage = 'none';
      scatter.clear();
      ++loadSeq;
      setCaption(null, '');
      map.hide();
      document.body.classList.add('photos');
      idle.style.display = '';
    }

    // --- Keep the screen awake while we're the foreground "screensaver" -------------
    // The receiver page is served over HTTPS (a secure context), so the Wake Lock API
    // is available here even though the media URLs are plain HTTP. This prevents the
    // screen from dimming/locking; it is NOT guaranteed to suppress Android TV's Ambient
    // overlay (that's a separate OS mechanism — the reliable lever is the sender keeping
    // the slideshow advancing, plus the device's "Stay awake" developer toggle).
    let wakeLock = null;
    async function acquireWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (e) { /* not fatal — fall back to slideshow-advance keep-awake */ }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && wakeLock === null) acquireWakeLock();
    });

    // ------------------------------------------------------------------ LOAD routing
    function handleLoad(request) {
      const media = request.media || {};
      const ct = (media.contentType || '').toLowerCase();
      const url = media.contentUrl || media.contentId;
      const title = (media.metadata && media.metadata.title) || '';
      const cd = media.customData || {};
      if (ct.indexOf('image/') === 0) {
        // Senders older than the audio spec send only the boolean cd.music; ones older than
        // that send neither and stay silent.
        music.apply(cd.audio, cd.music);
        if (cd.scatter && Array.isArray(cd.scatter.items) && cd.scatter.items.length >= 2) {
          showScatter(cd.scatter);
        } else {
          showImage(url, title, cd.presentation || {}, cd.photo);
        }
      } else {
        music.silence();                               // the video's own audio takes over
        showVideo();
        // Load it PAUSED and start it ourselves once the fade-in has settled (VIDEO_LEAD_MS after
        // CAF reports the media ready). Autoplay would have the film already running underneath
        // the fade, so the opening second would be watched through a dissolve.
        request.autoplay = false;
      }
      return request;   // let CAF process it too (esp. for video)
    }

    const TEST_MODE = /[?&]test=1/.test(location.search);
    if (TEST_MODE) {
      // Browser test harness: drive the page without a Cast device.
      window.__pc = { handleLoad, handleStopped, showImage, showScatter, showVideo, hideVideo,
                      holdThenHideVideo, applyPlace, loadedPhotos, notice, report,
                      // The video start path, which is otherwise unobservable off a device: a test
                      // stands in for the playerManager and asserts which signal rolled the film
                      // and what latency the phone was told about.
                      startVideoAfterLead, noteVideoReady, VIDEO_LEAD_MS, VIDEO_BELT_MS,
                      get videoStartTrigger() { return videoStartTrigger; },
                      get videoRolling() { return videoRolling; },
                      music, ambient, stream, AMBIENT_STYLES, map, setCaption, CARD_PAD,
                      get activeUrl() { return activeUrl; },
                      // Lets a test stand in for the Cast context and assert what `report` would
                      // have sent to the phone — the whole point of the error path is what leaves
                      // the TV, and there is no other way to observe it off a device.
                      set castContext(c) { castContext = c; },
                      resetReportCooldown() { reportedAt.clear(); } };
      idle.textContent = 'PhotoCast — test mode';
    }

    try {
      const context = cast.framework.CastReceiverContext.getInstance();
      castContext = context;                 // `report` sends the TV's problems to the phone
      const playerManager = context.getPlayerManager();

      // Intercept every LOAD: route images to our layers/scatter, video to CAF.
      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.LOAD,
        handleLoad
      );

      // Sender stop()/clear() sends a STOP media command — tidy the screen and the music.
      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.STOP,
        (request) => { handleStopped(); return request; }
      );

      // The phone took over playback — cancel our lead-in rather than un-pausing a beat later.
      const yieldPlaybackControl = (request) => {
        clearTimeout(videoStartTimer);
        videoStartTimer = null;
        videoLeadArmed = false;
        videoRolling = true;
        return request;
      };
      playerManager.setMessageInterceptor(cast.framework.messages.MessageType.PAUSE, yieldPlaybackControl);
      playerManager.setMessageInterceptor(cast.framework.messages.MessageType.PLAY, yieldPlaybackControl);

      // The film is loaded and holding its first frame; let it settle, then roll.
      playerManager.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE, () => {
        if (!showingVideo()) return;
        noteVideoReady();
        startVideoAfterLead(playerManager, VIDEO_LEAD_MS, 'load-complete');
      });

      // Because the LOAD is sent with autoplay off, the film only ever starts because we start it
      // — and everything downstream waits on that: the slideshow stops dead on a paused frame and
      // the phone's advance timer never fires either, since it is waiting for the film to end. So
      // readiness is read a SECOND, independent way here. A PAUSED player state is the same fact
      // PLAYER_LOAD_COMPLETE reports (loaded, holding the first frame), just observed from the
      // other side, and honouring it means a missing load-complete costs the ordinary lead-in
      // rather than the belt. Anything else — still buffering, or a state we can't read — falls
      // through to the belt, which fires well after the lead rather than let the show hang.
      const PlayerState = (cast.framework.messages && cast.framework.messages.PlayerState) || {};
      playerManager.addEventListener(cast.framework.events.EventType.MEDIA_STATUS, () => {
        if (!showingVideo() || videoRolling) return;
        let state = null;
        try { state = playerManager.getPlayerState(); } catch (e) { /* fall through to the belt */ }
        if (state === (PlayerState.PAUSED || 'PAUSED')) {
          noteVideoReady();
          startVideoAfterLead(playerManager, VIDEO_LEAD_MS, 'media-status');
        } else {
          startVideoAfterLead(playerManager, VIDEO_BELT_MS, 'belt');
        }
      });

      // Ended on its own: hold the closing frame, then fade out. An interruption (the phone
      // skipped, or stopped) is somebody else's transition, so leave those alone.
      playerManager.addEventListener(cast.framework.events.EventType.MEDIA_FINISHED, (event) => {
        if (!showingVideo()) return;
        const reason = event && event.endedReason;
        if (reason && reason !== 'END_OF_STREAM') return;
        holdThenHideVideo();
      });

      // A video the player can't handle: get its error card off the screen and tell the phone.
      playerManager.addEventListener(cast.framework.events.EventType.ERROR, (event) => {
        if (!showingVideo()) return;      // CAF also errors on the image LOADs we render ourselves
        hideVideo();
        report('video', 'The TV could not play a video.',
               'detailedErrorCode=' + ((event && event.detailedErrorCode) || '?'));
      });

      // Late place names from the phone (see ReceiverChannel.sendPlace) — a caption/map repaint
      // with no re-LOAD, so nothing on screen is disturbed.
      context.addCustomMessageListener(NAMESPACE, (event) => {
        const data = event && event.data;
        if (data && data.type === 'place') applyPlace(data);
      });

      // disableIdleTimeout keeps THIS receiver app from being torn down when playback goes
      // idle (e.g. a single held photo) — without it the device drops back to the launcher.
      // It does not by itself stop the system screensaver; see the Wake Lock note above.
      const options = new cast.framework.CastReceiverOptions();
      options.disableIdleTimeout = true;
      // Declaring the namespace is what allows sendCustomMessage on it in BOTH directions.
      options.customNamespaces = Object.assign({}, options.customNamespaces);
      options.customNamespaces[NAMESPACE] = cast.framework.system.MessageType.JSON;
      context.start(options);
    } catch (e) {
      // Outside a Cast device (browser testing) the framework may refuse to start — the
      // page's own rendering still works via the harness above.
      if (!TEST_MODE) throw e;
    }
    acquireWakeLock();
  </script>
</body>
</html>
